# Ambiente minimo CP2. Nao iniciar se o FIWARE existente ja ocupa essas portas.
services:
  mongo:
    image: mongo@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef
    volumes:
      - mongo-data:/data/db
  orion:
    image: fiware/orion@sha256:6b7051fef1b95561160e1da1fe01eab5b08ded91771e19c83f470fb037caccba
    depends_on: [mongo]
    command: ["-dbhost", "mongo", "-corsOrigin", "__ALL"]
    ports: ["127.0.0.1:${ORION_PORT:-1026}:1026"]
  mosquitto:
    image: eclipse-mosquitto@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    ports: ["127.0.0.1:${MQTT_PORT:-1883}:1883"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  iot-agent:
    image: fiware/iotagent-ul@sha256:a1518b23600344db9ba3d0beafea7edf25200b4b6f0b08dfac35d577814325de
    depends_on: [mongo, orion, mosquitto]
    ports: ["127.0.0.1:${IOTA_PORT:-4041}:4041"]
    environment:
      IOTA_CB_HOST: orion
      IOTA_CB_PORT: "1026"
      IOTA_CB_NGSI_VERSION: v2
      IOTA_NORTH_PORT: "4041"
      IOTA_MONGO_HOST: mongo
      IOTA_MONGO_PORT: "27017"
      IOTA_MQTT_HOST: mosquitto
      IOTA_MQTT_PORT: "1883"
      IOTA_PROVIDER_URL: http://iot-agent:4041
      IOTA_TIMESTAMP: "true"
      IOTA_AUTOCAST: "true"
      IOTA_LOG_LEVEL: INFO
volumes:
  mongo-data:
